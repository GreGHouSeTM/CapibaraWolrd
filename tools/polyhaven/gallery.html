<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Galerie Poly Haven</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2128; overflow: hidden; font: 13px system-ui, sans-serif; color: #eee; }
  canvas { display: block; }
  #info { position: absolute; left: 8px; top: 6px; text-shadow: 0 1px 2px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="info">Chargement…</div>
<script type="module">
// Galerie de contrôle des modèles Poly Haven (servie par Vite : http://localhost:5193/tools/polyhaven/gallery.html).
// Paramètres : ?cat=rocher,paroi (catégories) · ?ids=a,b · ?lod=all (les LOD côte à côte) · ?hour=7.2 · ?view=front|top
// Utilisé par tools/polyhaven/shot-gallery.cjs pour les planches de contrôle.
import * as THREE from 'three';
import { Models } from '/src/core/models.ts';
import { SkySystem } from '/src/world/sky.ts';

const qs = new URLSearchParams(location.search);
const info = document.getElementById('info');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 3000);
const sky = new SkySystem(renderer, scene);
sky.hour = +(qs.get('hour') || 7.2);
sky.daySpeed = 0;
sky.setShadowQuality(2048, 30);
scene.fog = new THREE.FogExp2(0xc8b8a0, 0.004);

// sol de terre de forêt (texture du jeu)
const tl = new THREE.TextureLoader();
const gtex = tl.load('/assets/tex/forestfloor_diff.jpg');
gtex.colorSpace = THREE.SRGBColorSpace;
gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping;
gtex.repeat.set(60, 60);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ map: gtex, roughness: 1, color: 0x9a9080 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function label(text, x, y, z, h) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 0, 512, 64);
  g.fillStyle = '#fff'; g.font = '30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 33);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, fog: false, depthTest: false }));
  s.scale.set(h * 8, h, 1);
  s.position.set(x, y, z);
  s.renderOrder = 10;
  scene.add(s);
}

const man = await Models.manifest();
let ids = Object.keys(man.models);
if (qs.get('cat')) { const cats = qs.get('cat').split(','); ids = ids.filter((i) => cats.includes(man.models[i].category)); }
if (qs.get('ids')) ids = qs.get('ids').split(',');
await Models.load(ids, (p) => (info.textContent = `Chargement ${(p * 100) | 0} %`));
const showLods = qs.get('lod') === 'all';

// disposition en rangées, du plus petit au plus grand
ids.sort((a, b) => man.models[a].dimensions[0] * man.models[a].dimensions[2] - man.models[b].dimensions[0] * man.models[b].dimensions[2]);
const rowW = Math.max(6, Math.sqrt(ids.reduce((s, i) => s + (man.models[i].dimensions[0] + 0.4) * (showLods ? man.models[i].lods.length : 1) * (man.models[i].dimensions[2] + 0.4), 0)) * 1.5);
let x = 0, z = 0, rowD = 0, maxX = 0, maxH = 0;
const box = new THREE.Box3();
let tris = 0;
for (const id of ids) {
  const m = man.models[id];
  const [w, h, d] = m.dimensions;
  const n = showLods ? m.lods.length : 1;
  const gap = Math.max(0.25, Math.max(w, d) * 0.15);
  if (x > 0 && x + (w + gap) * n > rowW) { z += rowD; x = 0; rowD = 0; }
  for (let l = 0; l < n; l++) {
    const o = Models.object(id, { lodDistances: [1e5] });
    // LOD imposée : on ne garde que le niveau voulu
    const lvl = Models.get(id).lods[l];
    o.levels.length = 0;
    o.clear();
    const g = new THREE.Group();
    for (const p of lvl.parts) {
      const mesh = new THREE.Mesh(p.geometry, p.material);
      mesh.matrixAutoUpdate = false; mesh.matrix.copy(p.matrix);
      mesh.castShadow = true; mesh.receiveShadow = true;
      g.add(mesh);
    }
    g.position.set(x + w / 2, 0, z + d / 2);
    scene.add(g);
    tris += lvl.triangles;
    box.expandByPoint(new THREE.Vector3(x, 0, z)).expandByPoint(new THREE.Vector3(x + w, h, z + d));
    label(n > 1 ? `${id} L${l} ${lvl.triangles}` : `${id} ${m.lods[0].triangles}`, x + w / 2, h + Math.max(0.06, h * 0.06) + 0.05, z + d / 2, Math.min(0.5, Math.max(0.05, Math.max(w, h) * 0.08)));
    x += w + gap;
    maxX = Math.max(maxX, x);
    maxH = Math.max(maxH, h);
  }
  rowD = Math.max(rowD, d + Math.max(0.3, d * 0.2));
}
const c = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const R = Math.max(size.x, size.z, size.y * 1.5) * 0.62 + 0.3;
if (qs.get('view') === 'top') camera.position.set(c.x, c.y + R * 1.6, c.z + R * 0.5);
else camera.position.set(c.x - R * 0.15, c.y + R * 0.55, c.z + R * 1.35);
camera.lookAt(c.x, c.y * 0.5, c.z);
ground.position.set(c.x, 0, c.z);
const focus = new THREE.Vector3(c.x, 0, c.z);
sky.setShadowQuality(2048, Math.max(4, R * 1.3));
sky.forceEnvUpdate();
sky.update(0.016, 0, focus, 0);
renderer.render(scene, camera);
info.textContent = `${ids.length} modèles · ${tris} triangles · ${(man.totalBytes / 1048576).toFixed(1)} Mo au total`;
window.__galleryReady = true;
function loop() { sky.update(0.016, 0, focus, 0); renderer.render(scene, camera); requestAnimationFrame(loop); }
if (!qs.has('still')) loop();
</script>
</body>
</html>
